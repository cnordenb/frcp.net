<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Civ Explorer (Fresh Random Civ Picker)</title>
<meta name="description" content="Find the Age of Empires II civs that have, or lack, the buildings, units and techs you choose.">
<!-- Civ Explorer (/civexplorer): the civs that have, or lack, the buildings, units and techs marked in a tree. Unlike
     the rest of the site, it's one file, with its data, styles and script inline, and it has no images or sounds. It's built to
     meet WCAG 2.2 at level AAA, as simple mode is: 16 px text with 1.5 line spacing and at least 7:1 contrast, 44 x 44 px
     targets and a 3 px focus ring. -->
<style>
:root {
  --bg: #fff;
  --ink: #000;
  --muted: #444;
  --line: #767676;
  --mark: #00478a;
  --face: #f0f0f0;
  --hover: #e5f3ff;
  --found: #fff0a0;
  --yes: #1a7f37;
  --no: #c62828;
  --target: 44px;
  --ui: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15181c;
    --ink: #fff;
    --muted: #c9ced4;
    --line: #8f969e;
    --mark: #9ccaff;
    --face: #23282e;
    --hover: #233243;
    --found: #3d3400;
    --yes: #2ea043;
    --no: #e5534b;
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--ui); }
a { color: var(--mark); }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
}

/* The site's name and the page's path after it, as in the address: frcp.net/civexplorer */
.top { margin-bottom: 12px; }
.title { display: flex; flex-wrap: wrap; align-items: center; }
.site { margin: 0; font-weight: 700; }
.site a { display: inline-flex; align-items: center; min-height: var(--target); }
h1 { margin: 0; font-size: 1rem; line-height: 1.5; }

/* Two panes: the tree, and the civs that fit what's marked in it. Side by side when there's room, else one above the
   other. */
.panes { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 720px) {
  .panes { grid-template-columns: minmax(20rem, 2fr) minmax(16rem, 3fr); }
}
.pane { display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--line); }
.pane-head {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 12px; border-bottom: 1px solid var(--line);
  background: var(--face);
}
.pane-head h2 { margin: 0 auto 0 0; font-size: 1.125rem; line-height: 1.25; }
.pane-head p { margin: 0; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.tool {
  min-width: var(--target); min-height: var(--target); padding: 8px 14px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--bg); color: var(--ink); font: inherit; line-height: 1.25; cursor: pointer;
}
.tool:hover { background: var(--hover); border-color: var(--mark); }
.find { display: flex; flex-basis: 100%; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.find input {
  flex: 1 1 10rem; min-width: 0; height: var(--target); padding: 0 8px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--bg); color: var(--ink); font: inherit;
}
/* What a click and a right-click do, as nothing on the screen shows the right-click */
.legend { display: flex; flex-basis: 100%; flex-wrap: wrap; gap: 4px 16px; }
.legend > span { display: inline-flex; align-items: center; gap: 8px; }
/* Text only screen readers read sits in its pane, rather than past the bottom of the page. */
.scroll { position: relative; padding: 8px; }

/* The tree, as in a file explorer: a branch opens and closes from the arrow before it, and a dotted line runs down
   from the arrow to the branch's last item. Each row is 44 px tall, and the whole of it after the arrow is the item's
   box. A long press can't select its text or open the phone's menu. */
.tree, .tree ul { margin: 0; padding: 0; list-style: none; }
.tree ul { margin-left: calc(var(--target) / 2); border-left: 1px dotted var(--line); }
.row { display: flex; align-items: center; min-height: var(--target); }
.twisty, .gap { position: relative; flex: none; width: var(--target); height: var(--target); }
.twisty { padding: 0; border: 0; border-radius: 4px; background: none; color: var(--ink); cursor: pointer; }
.twisty:hover { background: var(--hover); }
.twisty::before {
  content: ""; position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; border: solid currentColor; border-width: 0 2px 2px 0;
  transform: translate(-75%, -50%) rotate(-45deg);
}
.twisty[aria-expanded="true"]::before { transform: translate(-50%, -75%) rotate(45deg); }
.node {
  display: flex; flex: 1; align-items: center; gap: 10px; min-width: 0; min-height: var(--target); padding: 0 8px; border-radius: 4px;
  cursor: pointer; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.node:is(:hover, .pressed) { background: var(--hover); }
/* What Find matches has a bar down its left side, as well as its colour. */
.node.found { background: var(--found); box-shadow: inset 4px 0 0 var(--mark); }
.node .name { min-width: 0; overflow-wrap: anywhere; }
/* A box is empty, a green tick for must have, a red cross for must lack, or a bar for a branch that is partly marked.
   The tick and the cross differ in shape as well as colour. */
.box { position: relative; flex: none; width: 20px; height: 20px; border: 2px solid var(--line); border-radius: 3px; background: var(--bg); }
.box::before, .box::after { content: ""; position: absolute; left: 50%; top: 50%; }
[data-state="has"] > .box { border-color: var(--yes); background: var(--yes); }
[data-state="lacks"] > .box { border-color: var(--no); background: var(--no); }
[data-state="mixed"] > .box { border-color: var(--ink); }
[data-state="has"] > .box::after {
  width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translate(-50%, -60%) rotate(45deg);
}
[data-state="lacks"] > .box::before, [data-state="lacks"] > .box::after {
  width: 0; height: 13px; border-left: 2.5px solid #fff; transform: translate(-50%, -50%) rotate(45deg);
}
[data-state="lacks"] > .box::after { transform: translate(-50%, -50%) rotate(-45deg); }
[data-state="mixed"] > .box::after { width: 10px; height: 0; border-top: 2.5px solid var(--ink); transform: translate(-50%, -50%); }
/* Windows high contrast and other forced colours: the boxes in the system's colours */
@media (forced-colors: active) {
  .box { forced-color-adjust: none; border-color: CanvasText; background: Canvas; }
  :is([data-state="has"], [data-state="lacks"]) > .box { border-color: Highlight; background: Highlight; }
  [data-state] > .box::before, [data-state] > .box::after { border-color: HighlightText; }
  [data-state="mixed"] > .box::after { border-color: CanvasText; }
}
/* The names at the top of the tree and of groups are bold, and so is an item's that is marked itself, as a partly
   marked box can't show that. */
.tree > li > .row .name, .node:is(.group, .self) .name { font-weight: 700; }
.node .n { margin-left: auto; padding-left: 8px; color: var(--muted); font-variant-numeric: tabular-nums; }
:is(.twisty, .node):focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }

/* The civ list, in columns, under the filters. Each filter is a button that clears it. */
.ticked { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 4px 4px 12px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
.ticked ul { display: contents; list-style: none; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; min-height: var(--target); padding: 6px 14px; border: 1px solid var(--mark);
  border-radius: 22px; background: var(--hover); color: var(--ink); font: inherit; line-height: 1.25; text-align: left; cursor: pointer;
}
.chip:hover { border-width: 2px; padding: 5px 13px; }
.civs { margin: 0; padding: 4px; list-style: none; columns: 11rem; column-gap: 16px; }
.civs li { padding: 2px 0; break-inside: avoid; }
.none { margin: 0; padding: 4px; }
/* The footer, under the panes at the bottom of the page */
.foot p { margin: 8px 0 0; color: var(--muted); }

/* A screen 500 px tall or more holds the whole page: the panes fill it, and each scrolls on its own. A shorter one,
   such as one zoomed to 300 % or more, scrolls the page as a whole, as panes that small would show too little. */
@media (min-height: 500px) {
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; }
  .top, .foot { flex: none; }
  .panes { flex: 1; min-height: 0; grid-template-rows: minmax(0, 1fr); }
  .pane { min-height: 0; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scroll-padding: 8px; }
}
@media (min-height: 500px) and (max-width: 719px) {
  .panes { grid-template-rows: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; }
}
@media (max-width: 400px) {
  body { padding: 8px; }
  .scroll { padding: 4px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="title"><p class="site"><a href="../">frcp.net</a></p><h1>/civexplorer</h1></div>
</header>
<noscript><p>Civ Explorer needs JavaScript.</p></noscript>
<main class="panes">
  <section class="pane" aria-labelledby="treeTitle">
    <div class="pane-head">
      <h2 id="treeTitle">Buildings, units and <abbr title="technologies">techs</abbr></h2>
      <div class="tools">
        <button type="button" class="tool" id="clear">Clear</button>
        <button type="button" class="tool" id="expandAll">Expand all</button>
        <button type="button" class="tool" id="collapseAll">Collapse all</button>
      </div>
      <div class="find">
        <label for="find">Find</label>
        <input type="search" id="find" autocomplete="off" spellcheck="false">
        <p id="found" role="status"></p>
      </div>
      <p class="legend">
        <span data-state="has"><span class="box" aria-hidden="true"></span>Must have: click or Space.</span>
        <span data-state="lacks"><span class="box" aria-hidden="true"></span>Must lack: right-click, long press or X.</span>
      </p>
    </div>
    <div class="scroll"><ul class="tree" id="tree" role="list"></ul></div>
  </section>
  <section class="pane" aria-labelledby="civTitle">
    <div class="pane-head">
      <h2 id="civTitle" tabindex="-1"><abbr title="civilisations">Civs</abbr></h2>
      <p id="count" role="status"></p>
    </div>
    <div class="scroll">
      <div class="ticked" id="ticked" hidden>
        <span id="tickedLabel">Filters:</span><ul role="list" aria-labelledby="tickedLabel" id="chips"></ul>
      </div>
      <ul class="civs" id="civs" role="list"></ul>
      <p class="none" id="none" hidden></p>
    </div>
  </section>
</main>
<footer class="foot"><p>Data from <a href="https://aoe2techtree.net/">aoe2techtree.net</a>, October 2026.</p></footer>

  const civBit = new Map(CIVS.map((c, i) => [c, 1n << BigInt(i)]));

  // Arrow keys move through the tree as in a file explorer. Up and Down go to the item above or below, Home and End to
  // the first and last. Right opens a branch, or goes into an open one, and Left closes it, or goes to its parent.
  // Focus stays on the arrows or on the boxes, as it was. On a box, Space marks must have and X must lack.
  $("tree").addEventListener("keydown", (e) => {
    const item = items[e.target.dataset.i];
    if (!item || e.altKey || e.ctrlKey || e.metaKey) return;
    const mark = e.target === item.node && { " ": "has", x: "lacks", X: "lacks" }[e.key];
    if (mark) {
      e.preventDefault();
      toggle(item, mark);
      return;
    }
    if (e.shiftKey) return;
    const rows = items.filter(shown);
    const at = rows.indexOf(item);
    let to = null;
    if (e.key === "ArrowDown") to = rows[at + 1];
    else if (e.key === "ArrowUp") to = rows[at - 1];
    else if (e.key === "Home") to = rows[0];
    else if (e.key === "End") to = rows[rows.length - 1];
    else if (e.key === "ArrowRight") isOpen(item) ? (to = item.kids[0]) : setOpen(item, true);
    else if (e.key === "ArrowLeft") isOpen(item) ? setOpen(item, false) : (to = item.parent);
    else return;
    e.preventDefault();
    if (to) (e.target === item.twisty && to.twisty ? to.twisty : to.node).focus();
  });
  $("expandAll").addEventListener("click", () => items.forEach((item) => setOpen(item, true)));
  $("collapseAll").addEventListener("click", () => items.forEach((item) => setOpen(item, false)));

  // A click marks an item must have, with a green tick, and a right-click or a long press must lack, with a red cross.
  // Either marks the whole branch, or clears it if the branch is marked that way already. A right-click and a long
  // press act as the button or finger is let go, and moving off the item first calls them off.
  const itemAt = (target) => items[target.closest?.(".node")?.dataset.i];
  let press = null;
  let touchEnded = -Infinity;
  let swallowClick = false;
  const endPress = () => {
    if (!press) return;
    clearTimeout(press.timer);
    press.item.node.classList.remove("pressed");
    if (press.timer) touchEnded = performance.now();
    press = null;
  };
  $("tree").addEventListener("pointerdown", (e) => {
    swallowClick = false;
    endPress();
    const item = itemAt(e.target);
    if (!item || (e.button !== 2 && e.pointerType !== "touch")) return;
    press = { item, id: e.pointerId, x: e.clientX, y: e.clientY, ready: e.button === 2 };
    if (!press.ready) {
      press.timer = setTimeout(() => {
        press.ready = true;
        item.node.classList.add("pressed");
      }, 500);
    }
  });
  $("tree").addEventListener("pointermove", (e) => {
    if (press && e.pointerId === press.id && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) endPress();
  });
  $("tree").addEventListener("pointerup", (e) => {
    if (!press || e.pointerId !== press.id) return;
    const { item, ready } = press;
    endPress();
    if (ready && itemAt(e.target) === item) {
      toggle(item, "lacks");
      swallowClick = true;
    }
  });
  $("tree").addEventListener("pointercancel", endPress);
  // The browser's menu never opens on an item. One opened from the keyboard's menu key marks must lack at once. A
  // right-click's or a long press's menu, which some systems send as the button or finger lifts, is left to the above.
  $("tree").addEventListener("contextmenu", (e) => {
    const item = itemAt(e.target);
    if (!item) return;
    e.preventDefault();
    if (e.button === 2 || press || performance.now() - touchEnded < 600) return;
    toggle(item, "lacks");
  });
  $("tree").addEventListener("click", (e) => {
    const twisty = e.target.closest(".twisty");
    if (twisty) return setOpen(items[twisty.dataset.i], !isOpen(items[twisty.dataset.i]));
    const item = itemAt(e.target);
    if (!item || swallowClick) return;
    toggle(item, "has");
  });

  function setMark(item, mark) {
    if (!item.group) item.self = mark;
    for (const kid of item.kids) setMark(kid, mark);
  }
  function toggle(item, mark) {
    setMark(item, state(item) === mark ? null : mark);
    update();
  }
  // An item's box shows a mark when the item and its whole branch have it, and a bar when they're marked in different
  // ways. A group's box shows its branch alone. Rather than follow its branch alone, an item keeps its own mark:
  // clearing Champion leaves the rest of the Militia line marked, and marking Heavy Cavalry Archer doesn't ask for a
  // Cavalry Archer.
  function state(item) {
    const parts = item.kids.map(state);
    if (!item.group) parts.push(item.self);
    return parts.every((p) => p === parts[0]) ? parts[0] : "mixed";
  }
  function paint() {
    for (const item of items) {
      const s = state(item);
      item.node.dataset.state = s || "";
      item.node.setAttribute("aria-checked", s === "has" ? "true" : s === "mixed" ? "mixed" : "false");
      item.said.textContent = s === "lacks" ? ", must lack" : "";
      item.node.classList.toggle("self", !!item.self);
    }
  }
  // Find opens the branches down to each item whose name holds what's typed, ignoring case, spaces and hyphens, closes
  // the rest, marks the matches and scrolls the first into the pane. Enter goes to the first.
  const plain = (text) => text.toLowerCase().replace(/[^a-z0-9]/g, "");
  let found = [];
  $("find").addEventListener("input", () => {
    const text = plain($("find").value);
    found = text ? items.filter((item) => plain(item.name).includes(text)) : [];
    for (const item of items) item.node.classList.toggle("found", found.includes(item));
    $("found").textContent = !text ? "" : found.length ? `${found.length} found` : "None found";
    if (!found.length) return;
    const open = new Set();
    for (const item of found) for (let p = item.parent; p; p = p.parent) open.add(p);
    for (const item of items) setOpen(item, open.has(item));
    const pane = $("tree").parentElement;
    const top = found[0].node.getBoundingClientRect().top - pane.getBoundingClientRect().top;
    if (top < 0 || top > pane.clientHeight - found[0].node.offsetHeight) pane.scrollTop += top - 8;
  });
  $("find").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && found.length) found[0].node.focus();
  });

  $("clear").addEventListener("click", () => {
    roots.forEach((item) => setMark(item, null));
    update();
  });

  // ---- The civs ----

  // The civs that have every must-have item and lack every must-lack item are listed, and none while nothing is
  // marked. Each item shows how many civs would be listed if it were marked must have: those that fit the marks so far
  // and have it and its whole branch.
  function update() {
    paint();
    const marked = items.filter((item) => item.self);
    const match = marked.reduce((m, item) => m & (item.self === "has" ? item.set : ~item.set), ALL);
    const civs = marked.length ? CIVS.filter((c) => match & civBit.get(c)) : [];
    $("count").textContent = `${civs.length} compatible civilisation${civs.length === 1 ? "" : "s"}`;
    $("civs").replaceChildren(...civs.map((c) => el("li", { textContent: c })));
    $("none").hidden = civs.length > 0;
    $("none").textContent = marked.length ? "No civ fits all of the filters." : "Click items in the tree to list the civs that have them.";
    for (const item of items) {
      const n = size(match & item.all);
      item.count.replaceChildren(String(n), srOnly(n === 1 ? " civ" : " civs"));
    }
    // A chip for each marked item, but for one whose parent's whole branch is marked the same way: the parent's chip
    // stands for its branch.
    const mark = (item) => (["has", "lacks"].includes(state(item)) ? state(item) : item.self);
    const filters = items.filter((item) => mark(item) && !(item.parent && state(item.parent) === mark(item)));
    $("ticked").hidden = !filters.length;
    $("chips").replaceChildren(...filters.map((item) => {
      const chip = el("button", { type: "button", className: "chip" });
      chip.dataset.i = item.i;
      chip.dataset.state = mark(item);
      chip.append(el("span", { className: "box", ariaHidden: "true" }), srOnly(mark(item) === "has" ? "Clear must have: " : "Clear must lack: "),
        chipName(item), el("span", { textContent: "×", ariaHidden: "true" }));
      return el("li").appendChild(chip).parentNode;
    }));
  }
  // A chip's name has "Full" before an item whose whole branch must be had, such as Full Blacksmith, and its parent's
  // name after a group's whose name others share, such as Unique Units (Castle).
  const shared = new Set(items.filter((a) => items.some((b) => b !== a && b.name === a.name)).map((a) => a.name));
  const chipName = (item) => (item.kids.length && state(item) === "has" ? "Full " : "") + item.name
    + (shared.has(item.name) && item.parent ? ` (${item.parent.name})` : "");
  // A chip clears its item and its branch. Focus goes to the next chip, or the one before, or else to the Civs heading.
  $("chips").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    const at = [...$("chips").querySelectorAll(".chip")].indexOf(chip);
    setMark(items[chip.dataset.i], null);
    update();
    const chips = $("chips").querySelectorAll(".chip");
    (chips[at] || chips[at - 1] || $("civTitle")).focus();
  });

  update();
})();
</script>
</body>
</html>
