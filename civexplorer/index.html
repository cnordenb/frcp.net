<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AoE2 Civ Explorer</title>
<meta name="description" content="Find the Age of Empires II civilisations that have, or lack, the buildings, units and technologies you choose.">
<style>
:root {
  --bg: #fff;
  --ink: #000;
  --muted: #444;
  --line: #767676;
  --mark: #00478a;
  --face: #f0f0f0;
  --hover: #e5f3ff;
  --found: #fff0a0;
  --yes: #1a7f37;
  --no: #c62828;
  --shade: rgb(0 0 0 / 0.6);
  --target: 44px;
  --pad: 16px;
  --ui: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15181c;
    --ink: #fff;
    --muted: #c9ced4;
    --line: #8f969e;
    --mark: #9ccaff;
    --face: #23282e;
    --hover: #233243;
    --found: #3d3400;
    --yes: #2ea043;
    --no: #e5534b;
    --shade: rgb(0 0 0 / 0.75);
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; background: var(--bg); }
body {
  display: flex; flex-direction: column; height: 100vh; height: 100dvh; margin: 0; padding: var(--pad); background: var(--bg); color: var(--ink);
  font: 16px/1.5 var(--ui);
}
a { color: var(--mark); }
p, h1, h2 { max-width: 80ch; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
}

.top { display: flex; flex: none; align-items: flex-start; gap: 16px; margin-bottom: 12px; }
h1 { flex: 1 1 auto; align-self: center; min-width: 0; margin: 0; font-size: 1rem; line-height: 1.5; }
.tool.icon { display: inline-flex; flex: none; align-items: center; justify-content: center; margin-left: auto; padding: 0; font-size: 1.5rem; line-height: 1; }
.language { display: contents; }
#languageLabel { grid-area: 2 / 1; align-self: center; }
.language-button { display: inline-flex; grid-area: 2 / 2; justify-self: start; align-items: center; gap: 12px; }
.language-button::after {
  content: ""; width: 8px; height: 8px; border: solid currentColor; border-width: 0 2px 2px 0; transform: translateY(-25%) rotate(45deg);
}
.language-button[aria-expanded="true"]::after { transform: translateY(25%) rotate(-135deg); }
.language-list {
  display: grid; grid-area: 3 / 1 / 4 / 3; grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr)); align-content: start; gap: 4px;
  min-height: 0; margin: 0; padding: 8px; overflow-y: auto; list-style: none; border: 1px solid var(--line); border-radius: 4px; background: var(--bg);
}
.language-option { width: 100%; text-align: left; }
.language-option[aria-current="true"] { border-color: var(--mark); box-shadow: inset 4px 0 0 var(--mark); font-weight: 700; }
.load-error { flex: none; margin: 0 0 12px; }

.content { display: flex; flex: 1; flex-direction: column; min-height: 0; }
.panes { display: flex; flex: 1; flex-direction: column; gap: 12px; min-height: 0; }
.pane:first-child { flex: 0 1 auto; }
.pane:last-child { flex: 1 0 10rem; }
@media (min-width: 720px) {
  .panes { display: grid; grid-template-columns: minmax(20rem, 2fr) minmax(16rem, 3fr); grid-template-rows: minmax(0, 1fr); gap: 16px; }
}
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; border: 1px solid var(--line); }
.pane-head {
  display: flex; flex: none; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 12px; border-bottom: 1px solid var(--line);
  background: var(--face);
}
.pane-head h2 { margin: 0 auto 0 0; font-size: 1.125rem; line-height: 1.25; }
.pane-head p { margin: 0; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.tool {
  min-width: var(--target); min-height: var(--target); padding: 8px 14px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--bg); color: var(--ink); font: inherit; line-height: 1.25; cursor: pointer;
}
.tool:hover { background: var(--hover); border-color: var(--mark); }
.find { display: flex; flex-basis: 100%; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.find input {
  flex: 1 1 10rem; min-width: var(--target); height: var(--target); padding: 0 8px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--bg); color: var(--ink); font: inherit;
}
.legend { display: flex; flex-basis: 100%; flex-wrap: wrap; gap: 4px 16px; }
.legend > span { display: inline-flex; align-items: center; gap: 8px; }
.scroll { position: relative; flex: 1; min-height: 0; padding: 8px; overflow-y: auto; overscroll-behavior: contain; scroll-padding: 8px; }
.scroll:focus-visible { outline-offset: -3px; }

.tree, .tree ul { margin: 0; padding: 0; list-style: none; }
.tree ul { margin-left: calc(var(--target) / 2); border-left: 1px dotted var(--line); }
.row { display: flex; align-items: center; min-height: var(--target); }
.twisty, .gap { position: relative; flex: none; width: var(--target); height: var(--target); }
.twisty { padding: 0; border: 0; border-radius: 4px; background: none; color: var(--ink); cursor: pointer; }
.twisty:hover { background: var(--hover); }
.twisty::before {
  content: ""; position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; border: solid currentColor; border-width: 0 2px 2px 0;
  transform: translate(-75%, -50%) rotate(-45deg);
}
.twisty[aria-expanded="true"]::before { transform: translate(-50%, -75%) rotate(45deg); }
.node {
  display: flex; flex: 1; align-items: center; gap: 10px; min-width: 0; min-height: var(--target); padding: 0 8px; border-radius: 4px;
  cursor: pointer; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.node:is(:hover, .pressed) { background: var(--hover); }
.node.found { background: var(--found); box-shadow: inset 4px 0 0 var(--mark); }
.node .name { min-width: 0; overflow-wrap: anywhere; }
.box { position: relative; flex: none; width: 20px; height: 20px; border: 2px solid var(--line); border-radius: 3px; background: var(--bg); }
.box::before, .box::after { content: ""; position: absolute; left: 50%; top: 50%; }
[data-state="has"] > .box { border-color: var(--yes); background: var(--yes); }
[data-state="lacks"] > .box { border-color: var(--no); background: var(--no); }
[data-state="mixed"] > .box { border-color: var(--ink); }
[data-state="has"] > .box::after {
  width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translate(-50%, -60%) rotate(45deg);
}
[data-state="lacks"] > .box::before, [data-state="lacks"] > .box::after {
  width: 0; height: 13px; border-left: 2.5px solid #fff; transform: translate(-50%, -50%) rotate(45deg);
}
[data-state="lacks"] > .box::after { transform: translate(-50%, -50%) rotate(-45deg); }
[data-state="mixed"] > .box::after { width: 10px; height: 0; border-top: 2.5px solid var(--ink); transform: translate(-50%, -50%); }
@media (forced-colors: active) {
  .box { forced-color-adjust: none; border-color: CanvasText; background: Canvas; }
  :is([data-state="has"], [data-state="lacks"]) > .box { border-color: Highlight; background: Highlight; }
  [data-state] > .box::before, [data-state] > .box::after { border-color: HighlightText; }
  [data-state="mixed"] > .box::after { border-color: CanvasText; }
}
.tree > li > .row .name, .node:is(.group, .self) .name { font-weight: 700; }
.node .n { margin-left: auto; padding-left: 8px; white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
:is(.twisty, .node):focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }

.ticked {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 4px; padding: 4px 4px 12px; border-bottom: 1px solid var(--line);
}
.ticked ul { display: contents; list-style: none; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; min-height: var(--target); padding: 6px 14px; border: 1px solid var(--mark);
  border-radius: 22px; background: var(--hover); color: var(--ink); font: inherit; line-height: 1.25; text-align: left; cursor: pointer;
}
.chip:hover { border-width: 2px; padding: 5px 13px; }
.civs { margin: 0; padding: 4px; list-style: none; columns: 11rem; column-gap: 16px; }
.civs li { padding: 2px 0; break-inside: avoid; }
.none { margin: 0; padding: 4px; }
.foot { flex: none; }
.foot p { margin: 8px 0 0; color: var(--muted); }

dialog {
  width: min(48rem, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 16px; overflow-y: auto; border: 1px solid var(--line);
  border-radius: 4px; background: var(--bg); color: var(--ink);
}
dialog::backdrop { background: var(--shade); }
dialog h2 { margin: 0 0 8px; font-size: 1.125rem; }
dialog p { margin: 8px 0; }
.options { width: min(32rem, calc(100vw - 32px)); }
.options[open] {
  display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; gap: 8px 12px;
  height: min(30rem, calc(100vh - 32px)); height: min(30rem, calc(100dvh - 32px));
}
.options h2, .options form { grid-column: 1 / 3; margin: 0; }
.settings { grid-area: 3 / 1 / 4 / 3; min-height: 0; overflow-y: auto; }
.settings p { margin: 8px 0 0; }
.option {
  display: flex; align-items: center; gap: 10px; min-height: var(--target); padding: 0 8px; border-radius: 4px; cursor: pointer;
  -webkit-user-select: none; user-select: none;
}
.option:hover { background: var(--hover); }
.report-list { margin: 8px 0; padding-left: 1.5em; overflow-wrap: anywhere; }
.downloads a { display: inline-flex; align-items: center; min-height: var(--target); }

@media (max-height: 499px), (max-width: 719px) and (max-height: 639px) {
  .content { display: block; overflow-y: auto; }
  .panes { display: block; }
  .pane { min-height: auto; }
  .pane + .pane { margin-top: 12px; }
  .scroll { flex: none; overflow: visible; }
}
@media (max-width: 400px) {
  :root { --pad: 8px; }
  .scroll { padding: 4px; }
  .tree ul { margin-left: 12px; }
}

.test-frame { position: fixed; z-index: 2; top: 0; left: 0; border: 0; background: var(--bg); }
.test-frame.small { width: 320px; height: 256px; }
.test-frame.phone { width: 360px; height: 640px; }
.test-frame.tall { width: 390px; height: 844px; }
.text-spacing-test * { line-height: 1.5 !important; letter-spacing: 0.12em !important; word-spacing: 0.16em !important; }
.text-spacing-test p { margin-bottom: 2em !important; }
</style>

<body>
<header class="top" id="top" hidden>
  <h1 data-text="title"></h1>
  <button type="button" class="tool icon" id="optionsButton" aria-haspopup="dialog" aria-controls="options"><span class="cog" aria-hidden="true">⚙︎</span><span class="sr-only" data-text="options"></span></button>
</header>
<noscript><p>AoE2 Civ Explorer needs JavaScript.</p></noscript>
<p class="load-error" id="loadError" hidden>AoE2 Civ Explorer could not load its data.</p>
<div class="content" id="content" hidden>
<main class="panes">
  <section class="pane" aria-labelledby="treeTitle">
    <div class="pane-head">
      <h2 id="treeTitle" data-text="tree"></h2>
      <div class="tools">
        <button type="button" class="tool" id="clear" data-text="clear"></button>
        <button type="button" class="tool" id="expandAll" data-text="expandAll"></button>
        <button type="button" class="tool" id="collapseAll" data-text="collapseAll"></button>
      </div>
      <div class="find">
        <label for="find" data-text="find"></label>
        <input type="search" id="find" autocomplete="off" spellcheck="false">
        <p id="found" role="status"></p>
      </div>
      <p class="legend">
        <span data-state="has"><span class="box" aria-hidden="true"></span><span data-text="mustHave"></span></span>
        <span data-state="lacks"><span class="box" aria-hidden="true"></span><span data-text="mustLack"></span></span>
      </p>
    </div>
    <div class="scroll"><ul class="tree" id="tree" role="list"></ul></div>
  </section>
  <section class="pane" aria-labelledby="civTitle">
    <div class="pane-head">
      <h2 id="civTitle" tabindex="-1" data-text="civs"></h2>
      <p id="count" role="status"></p>
    </div>
    <div class="scroll" id="civScroll" tabindex="0" role="group" aria-labelledby="civTitle">
      <div class="ticked" id="ticked" hidden>
        <span id="tickedLabel" data-text="filters"></span><ul role="list" aria-labelledby="tickedLabel" id="chips"></ul>
      </div>
      <ul class="civs" id="civs" role="list"></ul>
      <p class="none" id="none" hidden></p>
    </div>
  </section>
</main>
<footer class="foot"><p id="source"><a id="sourceLink"></a></p></footer>
</div>
<dialog class="options" id="options" aria-labelledby="optionsTitle">
  <h2 id="optionsTitle" data-text="options"></h2>
  <div class="language" id="language">
    <span id="languageLabel" data-text="language"></span>
    <button type="button" class="tool language-button" id="languageButton" aria-expanded="false" aria-controls="languageList" aria-labelledby="languageLabel languageName"><span id="languageName"></span></button>
    <ul class="language-list" id="languageList" role="list" hidden></ul>
  </div>
  <div class="settings" id="settings">
    <div class="option" id="include" role="checkbox" tabindex="0" aria-checked="false" aria-describedby="includeHint"><span class="box" aria-hidden="true"></span><span data-text="includeAll"></span></div>
    <p id="includeHint" data-text="includeHint"></p>
  </div>
  <form method="dialog"><button class="tool" data-text="close"></button></form>
</dialog>
<dialog class="report" id="report" lang="en" aria-labelledby="reportTitle">
  <h2 id="reportTitle"></h2>
  <p id="reportStatus" role="status"></p>
  <ul class="report-list" id="reportList" role="list"></ul>
  <ul class="report-list downloads" id="reportDownloads" role="list" hidden></ul>
  <form method="dialog"><button class="tool" data-tool="close"></button></form>
</dialog>
<template id="itemTemplate"><li><div class="row"><button type="button" class="twisty" aria-expanded="false"></button><span class="gap"></span><div class="node" role="checkbox" tabindex="0" aria-checked="false"><span class="box" aria-hidden="true"></span><span class="name"></span><span class="sr-only lacking"></span><span class="n"><span class="count" aria-hidden="true"></span><span class="sr-only civ-count"></span></span></div></div><ul role="list" hidden></ul></li></template>
<template id="chipTemplate"><li><button type="button" class="chip"><span class="box" aria-hidden="true"></span><span class="sr-only chip-label"></span><span class="chip-name" aria-hidden="true"></span><span aria-hidden="true">×</span></button></li></template>
<template id="civTemplate"><li></li></template>

<script type="module">
const LINE_WIDTH = 120;
const ABBREVIATION = /[\p{L}\p{N}_]\.(\s|$)|\bE-|-\s/u;

const params = new URLSearchParams(location.search);
let data = null;
let civBit = new Map();
let ALL = 0n;

const attempt = (action) => {
  try {
    return action();
  } catch {
    return null;
  }
};

const recall = (key) => attempt(() => localStorage.getItem(key));

const remember = (key, value) => attempt(() => (value === null ? localStorage.removeItem(key) : localStorage.setItem(key, value)));

const files = new Map([...document.querySelectorAll("script[data-file]")].map((s) => [s.dataset.file, s.textContent]));

const load = (url) => (files.has(url) ? Promise.resolve(files.get(url)) : new Promise((resolve, reject) => {
  const request = new XMLHttpRequest();
  request.open("GET", url);
  request.onload = () => (request.status === 200 || (request.status === 0 && request.responseText)
    ? resolve(request.responseText)
    : reject(new Error(`${url} (${request.status})`)));
  request.onerror = () => reject(new Error(url));
  request.send();
}));

const fill = (template, values) => template.replace(/\{(\w+)\}/g, (whole, key) => (key in values ? String(values[key]) : whole));

const treeKeys = (nodes, key) => nodes.flatMap((node) => [...(node[key] ? [node[key]] : []), ...treeKeys(node.kids ?? [], key)]);

let language;
let words;
let tag;
let collator;
let plurals;
let numbers;

function useLanguage(code) {
  language = code;
  tag = data.languages[code].tag;
  words = data.text[code];
  collator = new Intl.Collator(tag);
  plurals = new Intl.PluralRules(tag);
  numbers = new Intl.NumberFormat(tag);
}

const nameOf = (item) => (item.group ? words.groups[item.key] : words.items[item.key]) ?? item.key;

const civName = (civ) => words.civs[civ] ?? civ;

const plural = (key, n) => {
  const forms = words.ui[key];
  return fill(forms[plurals.select(n)] ?? forms.other, { n: numbers.format(n) });
};

const plain = (text) => text.toLocaleLowerCase(tag).normalize("NFD").replace(/\p{M}/gu, "").replace(/[^\p{L}\p{N}]/gu, "");

const localeFile = (code) => `locales/${code}.json`;

const unpack = (file) => {
  const first = Object.keys(file.languages)[0];
  return { ...file, overrides: { [first]: file.overrides }, text: { [first]: file.text } };
};

const addLanguage = (set, code, file) => {
  set.overrides[code] = file.overrides;
  set.text[code] = file.text;
};

function useData(raw) {
  data = unpack(JSON.parse(raw));
  civBit = new Map(data.civs.map((civ, i) => [civ, 1n << BigInt(i)]));
  ALL = (1n << BigInt(data.civs.length)) - 1n;
}

const loadLanguage = (code) => (data.text[code]
  ? Promise.resolve()
  : load(localeFile(code)).then((raw) => addLanguage(data, code, JSON.parse(raw))));

const loadLanguages = () => Promise.all(Object.keys(data.languages).map(loadLanguage));

function pack(set) {
  const [first, ...others] = Object.keys(set.languages);

  const own = (key, code) => set[key][code] ?? {};

  return [
    { path: "data.json", value: Object.fromEntries(Object.entries(set)
      .map(([key, value]) => [key, ["overrides", "text"].includes(key) ? own(key, first) : value])) },
    ...others.map((code) => ({ path: localeFile(code), value: { overrides: own("overrides", code), text: own("text", code) } })),
  ];
}

function preferredLanguage() {
  const codes = Object.keys(data.languages);
  const tags = codes.map((code) => data.languages[code].tag.toLowerCase());
  const asked = [params.get("lng"), recall("language")].find((code) => codes.includes(code));
  if (asked) return asked;
  for (const wanted of navigator.languages ?? []) {
    const lower = wanted.toLowerCase();
    const at = tags.indexOf(lower) >= 0 ? tags.indexOf(lower) : tags.findIndex((t) => t.split("-")[0] === lower.split("-")[0]);
    if (at >= 0) return codes[at];
  }
  return codes[0];
}

const bit = (civ) => {
  if (!civBit.has(civ)) throw new Error(`unknown civilisation ${civ}`);
  return civBit.get(civ);
};

const size = (set) => {
  let n = 0;
  for (let s = set; s; s &= s - 1n) n++;
  return n;
};

const setOf = (rule) => (rule === "all"
  ? ALL
  : rule.has
    ? rule.has.reduce((s, civ) => s | bit(civ), 0n)
    : rule.lacks.reduce((s, civ) => s & ~bit(civ), ALL));

const civsOf = (set) => data.civs.filter((civ) => set & civBit.get(civ));

const isScalar = (value) => value === null || typeof value !== "object";

const isFlatList = (value) => Array.isArray(value) && value.every(isScalar);

const flat = (value) => (Array.isArray(value)
  ? `[${value.map(flat).join(", ")}]`
  : isScalar(value)
    ? JSON.stringify(value)
    : `{${Object.entries(value).map(([key, item]) => `${JSON.stringify(key)}: ${flat(item)}`).join(", ")}}`);

function toJson(value, indent = "") {
  const inner = `${indent}  `;
  if (isScalar(value) || isFlatList(value)) return flat(value);
  if (Array.isArray(value)) return `[\n${value.map((item) => inner + toJson(item, inner)).join(",\n")}\n${indent}]`;
  const entries = Object.entries(value);
  const simple = entries.every(([, item]) => isScalar(item) || isFlatList(item));
  if (simple && (entries.length === 1 || indent.length + flat(value).length <= LINE_WIDTH)) return flat(value);
  const head = entries.slice(0, -1);
  const [lastKey, last] = entries[entries.length - 1];
  if (Array.isArray(last) && head.every(([, item]) => isScalar(item))) {
    const opening = head.map(([key, item]) => `${flat(key)}: ${flat(item)}, `).join("");
    return `{${opening}${flat(lastKey)}: [\n${last.map((item) => inner + toJson(item, inner)).join(",\n")}\n${indent}]}`;
  }
  return `{\n${entries.map(([key, item]) => `${inner}${flat(key)}: ${toJson(item, inner)}`).join(",\n")}\n${indent}}`;
}

const isLower = (char) => !!char && char !== char.toUpperCase() && char === char.toLowerCase();

const capitalise = (text) => text.charAt(0).toUpperCase() + text.slice(1);

function joinLines(text, settings) {
  let joined = "";
  for (const part of text.split("<br>").map((piece) => piece.trim())) {
    if (!part) continue;
    if (!joined) joined = part;
    else if (!settings.spaces) joined += part;
    else if (joined.endsWith("-") && settings.mergeHyphens && isLower(part[0])) joined = joined.slice(0, -1) + part;
    else if (joined.endsWith("-")) joined += part;
    else joined += ` ${part}`;
  }
  return joined.replace(/\s*\/\s*/g, "/").replace(/\s+/g, " ").trim();
}

function localName(strings, node, settings, offset) {
  const label = joinLines(strings[node.name_string_id] ?? "", settings);
  if (label && !ABBREVIATION.test(label)) return capitalise(label);
  const bold = /<b>(.*?)<\/b>/.exec(strings[node.help_string_id - offset] ?? "");
  return capitalise(bold ? joinLines(bold[1], settings) : label);
}

function availabilityOf(owners, civs) {
  const having = civs.filter((civ) => owners.has(civ));
  const lacking = civs.filter((civ) => !owners.has(civ));
  if (!lacking.length) return "all";
  return having.length <= lacking.length ? { has: having } : { lacks: lacking };
}

function missingText(set) {
  const codes = Object.keys(set.languages);
  const reference = set.text[codes[0]];
  const groups = [...new Set(treeKeys(set.tree, "group"))];
  return codes.flatMap((code) => {
    const text = set.text[code] ?? {};
    return [
      ...Object.keys(reference.ui).filter((key) => !text.ui?.[key]),
      ...groups.filter((key) => !text.groups?.[key]),
    ].map((name) => ({ language: set.languages[code].name, name }));
  });
}

function refresh(current, techtree, trees, strings) {
  const tools = current.tools;
  const messages = [];

  const say = (key, values) => messages.push(fill(tools[key], values));

  const civs = Object.keys(techtree.civs).sort();
  const nodes = new Map();
  const owners = new Map();
  civs.forEach((civ, i) => {
    for (const node of [...trees[i].buildings, ...trees[i].units_techs]) {
      if (!nodes.has(node.name)) {
        nodes.set(node.name, node);
        owners.set(node.name, new Set());
      }
      if (node.node_status !== "NotAvailable") owners.get(node.name).add(civ);
    }
  });
  const keys = treeKeys(current.tree, "item");
  const duplicates = [...new Set(keys.filter((key, i) => keys.indexOf(key) !== i))].sort();
  const unknown = keys.filter((key) => !nodes.has(key));
  duplicates.forEach((name) => say("duplicate", { name }));
  unknown.forEach((name) => say("unknown", { name }));
  if (duplicates.length || unknown.length) return { messages, fresh: null };

  const fresh = structuredClone(current);
  fresh.civs = civs;
  fresh.availability = Object.fromEntries(keys.map((key) => [key, availabilityOf(owners.get(key), civs)]));
  Object.entries(current.languages).forEach(([code, settings], i) => {
    const overrides = current.overrides[code] ?? {};
    const text = (fresh.text[code] ??= {});
    text.civs = Object.fromEntries(civs.map((civ) => [civ,
      overrides[civ] || capitalise(joinLines(strings[i][techtree.civs[civ].name_string_id] ?? "", settings)) || civ]));
    text.items = Object.fromEntries(keys.map((key) => [key,
      overrides[key] || localName(strings[i], nodes.get(key), settings, current.source.helpOffset) || key]));
  });
  const now = new Date();
  fresh.source.updated = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;

  civs.filter((civ) => !current.civs.includes(civ)).forEach((name) => say("civAdded", { name }));
  current.civs.filter((civ) => !civs.includes(civ)).forEach((name) => say("civRemoved", { name }));
  keys.filter((key) => key in current.availability && JSON.stringify(current.availability[key]) !== JSON.stringify(fresh.availability[key]))
    .forEach((name) => say("changed", { name }));
  keys.filter((key) => !owners.get(key).size).forEach((name) => say("nobody", { name }));
  for (const [code, settings] of Object.entries(current.languages)) {
    for (const section of ["civs", "items"]) {
      for (const [key, name] of Object.entries(fresh.text[code][section])) {
        const before = current.text[code]?.[section]?.[key];
        if (before !== undefined && before !== name) say("renamed", { language: settings.name, key, name });
      }
    }
  }
  [...nodes.keys()].filter((name) => !keys.includes(name) && !current.ignore.includes(name)).sort()
    .forEach((name) => say("unplaced", { name }));
  missingText(fresh).forEach((problem) => say("missingText", problem));
  return { messages, fresh };
}

async function fetchUpdate() {
  const get = async (path) => JSON.parse(await load(data.source.data + path));

  const techtree = await get("data.json");
  const civs = Object.keys(techtree.civs).sort();
  const [trees, strings] = await Promise.all([
    Promise.all(civs.map((civ) => get(`trees/${civ.toUpperCase()}.json`))),
    Promise.all(Object.keys(data.languages).map((code) => get(`locales/${code}/strings.json`))),
  ]);
  const { messages, fresh } = refresh(data, techtree, trees, strings);
  if (!fresh) return { messages, fresh, files: [] };
  const before = new Map(pack(data).map(({ path, value }) => [path, toJson(value)]));
  const files = pack(fresh).map(({ path, value }) => ({ path, json: toJson(value) }))
    .filter(({ path, json }) => path === "data.json" || json !== before.get(path));
  return { messages, fresh, files };
}

const items = [];
const roots = [];
let include = false;
let matching = 0n;
let shared = new Set();

const setIncluded = (on) => {
  include = on;
};

function collect(nodes, parent) {
  for (const node of nodes) {
    if (node.item && !(node.item in data.availability)) throw new Error(`no availability for ${node.item}`);
    const key = node.item ?? node.group;
    const item = {
      i: items.length, key, path: parent ? `${parent.path}|${key}` : key, group: !node.item,
      set: node.item ? setOf(data.availability[node.item]) : ALL, optional: node.optional === true, upgrades: node.upgrades === true,
      self: null, chosen: null, kids: [], parent,
    };
    (parent ? parent.kids : roots).push(item);
    items.push(item);
    collect(node.kids ?? [], item);
  }
}

const whole = (item) => (item.all ??= item.kids.reduce((s, kid) => s & whole(kid), item.set));

function prune(nodes) {
  return nodes.flatMap((node) => {
    if (node.unique) return [];
    const kids = prune(node.kids ?? []);
    const rule = node.item && data.availability[node.item];
    const civs = rule ? size(setOf(rule)) : 0;
    if (!kids.length && (node.group || civs === 1 || civs === data.civs.length)) return [];
    return [{ ...node, kids }];
  });
}

function rebuild() {
  const chosen = new Map(items.map((item) => [item.path, item.chosen]));
  items.length = 0;
  roots.length = 0;
  collect(include ? data.tree : prune(data.tree), null);
  items.forEach(whole);
  for (const item of items) item.chosen = chosen.get(item.path) ?? null;
}

function setMark(item, mark) {
  if (!item.group) item.chosen = mark;
  for (const kid of item.kids) setMark(kid, mark);
}

function settle() {
  const full = new Set();
  for (const item of [...items].reverse()) {
    const under = item.kids.every((kid) => full.has(kid));
    if (!item.group) item.self = item.kids.length && under && !item.optional ? "has" : item.chosen;
    if (under && (item.group || item.self === "has")) full.add(item);
  }
}

function state(item) {
  const parts = item.kids.map(state);
  if (!item.group) parts.push(item.self);
  return parts.every((part) => part === parts[0]) ? parts[0] : "mixed";
}

const isUnitOrTech = (item) => {
  for (let p = item.parent; p; p = p.parent) if (!p.group) return !item.group;
  return false;
};

const descendants = (item) => item.kids.flatMap((kid) => [kid, ...descendants(kid)]);

function sameCount(item) {
  const line = [item];
  while (line.at(-1).kids.length === 1 && !line.at(-1).kids[0].group && size(line.at(-1).kids[0].set) === size(item.set)) line.push(line.at(-1).kids[0]);
  return line;
}

function mark(item, kind) {
  const unit = isUnitOrTech(item);
  const next = (unit ? item.self : state(item)) === kind ? null : kind;
  if (unit && next) {
    if (next === "lacks") descendants(item).filter((each) => each.chosen === "has").forEach((each) => { each.chosen = null; });
    sameCount(item).forEach((each) => { each.chosen = next; });
  } else setMark(item, next);
  settle();
  for (let p = item.parent; p; p = p.parent) if (p.self === "has" && p.chosen === "lacks") p.chosen = null;
  return next ? [...chainOf(item), ...(unit ? sameCount(item) : descendants(item))] : [];
}

function boxState(item) {
  if (!isUnitOrTech(item) || !item.self) return state(item);
  return descendants(item).every((each) => !each.self || each.self === item.self) ? item.self : "mixed";
}

function fit() {
  settle();
  const marked = items.filter((item) => item.self);
  matching = marked.reduce((m, item) => m & (item.self === "has" ? item.set : ~item.set), ALL);
  return marked;
}

const markOf = (item) => (["has", "lacks"].includes(state(item)) ? state(item) : item.self);

const lineEnd = (item) => {
  let end = item;
  while (end.kids.length === 1 && !end.kids[0].group) end = end.kids[0];
  return item.group || end.kids.length ? null : end;
};

function lineOf(item) {
  let root = item;
  while (root.parent && !root.parent.group && root.parent.kids.length === 1) root = root.parent;
  if (!lineEnd(root)) return [item];
  const line = [root];
  while (line.at(-1).kids.length) line.push(line.at(-1).kids[0]);
  return line;
}

function chainOf(item) {
  const chain = [item];
  while (chain.at(-1).kids.length === 1) chain.push(chain.at(-1).kids[0]);
  return chain;
}

function filtersOf() {
  const marked = items.filter((item) => markOf(item) && !(item.parent && state(item.parent) === markOf(item)))
    .map((item) => ({ item, mark: markOf(item), line: lineOf(item) }));

  const depth = ({ item, line }) => line.indexOf(item);

  return marked.filter((filter) => !marked.some((other) => other !== filter && other.mark === filter.mark && other.line[0] === filter.line[0]
    && (filter.mark === "has" ? depth(other) > depth(filter) : depth(other) < depth(filter))));
}

function share() {
  const seen = new Map();
  for (const item of items) seen.set(nameOf(item), (seen.get(nameOf(item)) ?? 0) + 1);
  shared = new Set([...seen].filter(([, n]) => n > 1).map(([name]) => name));
}

function chipName(item, kind) {
  const named = (kind === "has" && (isUnitOrTech(item) || item.upgrades) && lineOf(item).findLast((each) => each.self === "has")) || item;
  const name = shared.has(nameOf(named)) && named.parent ? fill(words.ui.inParent, { name: nameOf(named), parent: nameOf(named.parent) }) : nameOf(named);
  return named.kids.length && state(item) === "has" ? fill(words.ui.full, { name }) : name;
}

function unmarkLine(item, kind) {
  const line = lineOf(item);
  if (line.length > 1) line.filter((each) => each.self === kind).forEach((each) => { each.chosen = null; });
  else setMark(item, null);
}

const $ = (id) => document.getElementById(id);

const clone = (id) => $(id).content.firstElementChild.cloneNode(true);

const compose = (node, template, values) => node.replaceChildren(...template.split(/(\{\w+\})/).filter(Boolean)
  .map((part) => (/^\{\w+\}$/.test(part) && part.slice(1, -1) in values ? values[part.slice(1, -1)] : part)));

function plant() {
  const open = new Set(items.filter(isOpen).map((item) => item.path));
  endPress();
  found = [];
  rebuild();
  $("tree").replaceChildren();
  build(roots, $("tree"));
  for (const item of items) if (open.has(item.path)) setOpen(item, true);
}

function build(list, ul) {
  for (const item of list) {
    const li = clone("itemTemplate");
    const twisty = li.querySelector(".twisty");
    const kids = li.querySelector("ul");
    item.node = li.querySelector(".node");
    item.label = li.querySelector(".name");
    item.lacking = li.querySelector(".lacking");
    item.count = li.querySelector(".count");
    item.civCount = li.querySelector(".civ-count");
    item.node.dataset.i = item.i;
    item.node.classList.toggle("group", item.group);
    item.label.id = `t${item.i}`;
    if (item.kids.length) {
      li.querySelector(".gap").remove();
      item.twisty = twisty;
      twisty.dataset.i = item.i;
      twisty.setAttribute("aria-controls", `k${item.i}`);
      twisty.setAttribute("aria-labelledby", `t${item.i}`);
      item.list = kids;
      kids.id = `k${item.i}`;
      build(item.kids, kids);
    } else {
      twisty.remove();
      kids.remove();
    }
    ul.append(li);
  }
}

const isOpen = (item) => item.twisty?.getAttribute("aria-expanded") === "true";

function setOpen(item, open) {
  if (!item.twisty) return;
  item.twisty.setAttribute("aria-expanded", String(open));
  item.list.hidden = !open;
  count(item);
}

function count(item) {
  const own = size(matching & (item.group ? item.all : item.set));
  const all = size(matching & item.all);
  if (item.group || !item.kids.length || isOpen(item)) {
    item.count.textContent = numbers.format(own);
    item.civCount.textContent = plural("civCount", own);
    return;
  }
  compose(item.count, words.ui.range, { own: numbers.format(own), all: numbers.format(all) });
  item.civCount.textContent = fill(words.ui.civRange, { own: plural("civCount", own), all: plural("civCount", all) });
}

const expand = (item) => chainOf(item).forEach((each) => setOpen(each, true));

const shown = (item) => !item.parent || (isOpen(item.parent) && shown(item.parent));

function toggle(item, kind) {
  for (const each of mark(item, kind)) for (let p = each.parent; p !== item.parent; p = p.parent) setOpen(p, true);
  update();
}

function paint() {
  for (const item of items) {
    const s = boxState(item);
    item.node.dataset.state = s || "";
    item.node.setAttribute("aria-checked", s === "has" ? "true" : s === "mixed" ? "mixed" : "false");
    item.lacking.textContent = s === "lacks" ? words.ui.lacking : "";
    item.node.classList.toggle("self", !!item.self);
  }
}

function update() {
  const marked = fit();
  paint();
  const civs = marked.length ? civsOf(matching) : [];
  $("count").textContent = plural("compatible", civs.length);
  $("civs").replaceChildren(...civs.map(civName).sort(collator.compare).map((name) => {
    const li = clone("civTemplate");
    li.textContent = name;
    return li;
  }));
  $("none").hidden = civs.length > 0;
  $("none").textContent = marked.length ? words.ui.noMatch : words.ui.start;
  items.forEach(count);
  const filters = filtersOf();
  $("ticked").hidden = !filters.length;
  $("chips").replaceChildren(...filters.map(({ item, mark: kind }) => {
    const li = clone("chipTemplate");
    const chip = li.querySelector(".chip");
    const name = chipName(item, kind);
    chip.dataset.i = item.i;
    chip.dataset.state = kind;
    li.querySelector(".chip-label").textContent = fill(words.ui[kind === "has" ? "clearHas" : "clearLacks"], { name });
    li.querySelector(".chip-name").textContent = name;
    return li;
  }));
}

let found = [];

function find() {
  const text = plain($("find").value);
  found = text ? items.filter((item) => plain(nameOf(item)).includes(text)) : [];
  for (const item of items) item.node.classList.toggle("found", found.includes(item));
  $("found").textContent = !text ? "" : found.length ? plural("found", found.length) : words.ui.noneFound;
  if (!found.length) return;
  const open = new Set();
  for (const item of found) for (let p = item.parent; p; p = p.parent) open.add(p);
  for (const item of items) setOpen(item, open.has(item));
  found[0].node.scrollIntoView({ block: "nearest" });
}

const itemAt = (target) => items[target.closest?.(".node")?.dataset.i];

let press = null;
let touchEnded = -Infinity;
let swallowClick = false;

const endPress = () => {
  if (!press) return;
  clearTimeout(press.timer);
  press.item.node.classList.remove("pressed");
  if (press.timer) touchEnded = performance.now();
  press = null;
};

function wireTree() {
  const tree = $("tree");
  tree.addEventListener("keydown", (e) => {
    const item = items[e.target.dataset.i];
    if (!item || e.altKey || e.ctrlKey || e.metaKey) return;
    const kind = e.target === item.node && { " ": "has", x: "lacks", X: "lacks" }[e.key];
    if (kind) {
      e.preventDefault();
      toggle(item, kind);
      return;
    }
    if (e.shiftKey) return;
    const rows = items.filter(shown);
    const at = rows.indexOf(item);
    let to = null;
    if (e.key === "ArrowDown") to = rows[at + 1];
    else if (e.key === "ArrowUp") to = rows[at - 1];
    else if (e.key === "Home") to = rows[0];
    else if (e.key === "End") to = rows[rows.length - 1];
    else if (e.key === "ArrowRight") isOpen(item) ? (to = item.kids[0]) : expand(item);
    else if (e.key === "ArrowLeft") isOpen(item) ? setOpen(item, false) : (to = item.parent);
    else return;
    e.preventDefault();
    if (to) (e.target === item.twisty && to.twisty ? to.twisty : to.node).focus();
  });
  tree.addEventListener("pointerdown", (e) => {
    swallowClick = false;
    endPress();
    const item = itemAt(e.target);
    if (!item || (e.button !== 2 && e.pointerType !== "touch")) return;
    press = { item, id: e.pointerId, x: e.clientX, y: e.clientY, ready: e.button === 2 };
    if (!press.ready) {
      press.timer = setTimeout(() => {
        press.ready = true;
        item.node.classList.add("pressed");
      }, 500);
    }
  });
  tree.addEventListener("pointermove", (e) => {
    if (press && e.pointerId === press.id && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) endPress();
  });
  tree.addEventListener("pointerup", (e) => {
    if (!press || e.pointerId !== press.id) return;
    const { item, ready } = press;
    endPress();
    if (ready && itemAt(e.target) === item) {
      toggle(item, "lacks");
      swallowClick = true;
    }
  });
  tree.addEventListener("pointercancel", endPress);
  tree.addEventListener("contextmenu", (e) => {
    const item = itemAt(e.target);
    if (!item) return;
    e.preventDefault();
    if (e.button === 2 || press || performance.now() - touchEnded < 600) return;
    toggle(item, "lacks");
  });
  tree.addEventListener("click", (e) => {
    const twisty = e.target.closest(".twisty");
    if (twisty) return isOpen(items[twisty.dataset.i]) ? setOpen(items[twisty.dataset.i], false) : expand(items[twisty.dataset.i]);
    const item = itemAt(e.target);
    if (!item || swallowClick) return;
    toggle(item, "has");
  });
  $("expandAll").addEventListener("click", () => items.forEach((item) => setOpen(item, true)));
  $("collapseAll").addEventListener("click", () => items.forEach((item) => setOpen(item, false)));
  $("clear").addEventListener("click", () => {
    roots.forEach((item) => setMark(item, null));
    update();
  });
  $("find").addEventListener("input", find);
  $("find").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && found.length) found[0].node.focus();
  });
  $("chips").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    const at = [...$("chips").querySelectorAll(".chip")].indexOf(chip);
    unmarkLine(items[chip.dataset.i], chip.dataset.state);
    update();
    const chips = $("chips").querySelectorAll(".chip");
    (chips[at] || chips[at - 1] || $("civTitle")).focus();
  });
}

const options = () => [...$("languageList").querySelectorAll("[data-language]")];

function setMenu(open, focus) {
  $("languageButton").setAttribute("aria-expanded", String(open));
  $("languageList").hidden = !open;
  $("settings").hidden = open;
  focus?.focus();
}

function buildLanguages() {
  $("languageList").replaceChildren(...Object.entries(data.languages).map(([code, { name, tag: languageTag }]) => {
    const li = clone("languageTemplate");
    const option = li.querySelector("button");
    option.dataset.language = code;
    option.lang = languageTag;
    option.textContent = name;
    return li;
  }));
}

function setLanguage(code) {
  useLanguage(code);
  document.documentElement.lang = tag;
  for (const node of document.querySelectorAll("[data-text]")) node.textContent = words.ui[node.dataset.text];
  $("languageName").textContent = data.languages[code].name;
  for (const option of options()) option.setAttribute("aria-current", String(option.dataset.language === code));
  label();
  const [year, month] = data.source.updated.split("-").map(Number);
  $("sourceLink").href = data.source.url;
  $("sourceLink").textContent = data.source.name;
  compose($("source"), words.ui.source, {
    source: $("sourceLink"),
    date: new Intl.DateTimeFormat(tag, { year: "numeric", month: "long" }).format(new Date(year, month - 1)),
  });
  update();
  if ($("find").value) find();
}

function label() {
  for (const item of items) item.label.textContent = nameOf(item);
  share();
}

function showInclude() {
  $("include").setAttribute("aria-checked", String(include));
  $("include").dataset.state = include ? "has" : "";
}

function setInclude(on) {
  setIncluded(on);
  remember("include", String(on));
  showInclude();
  plant();
  label();
  update();
  if ($("find").value) find();
}

function wireOptions() {
  $("optionsButton").addEventListener("click", () => $("options").showModal());
  $("options").addEventListener("close", () => setMenu(false));
  $("include").addEventListener("click", () => setInclude(!include));
  $("include").addEventListener("keydown", (e) => {
    if (e.key !== " ") return;
    e.preventDefault();
    setInclude(!include);
  });
}

let chosen = null;

function choose(code) {
  chosen = code;
  if (!data.text[code]) {
    loadLanguage(code).then(() => {
      if (chosen === code) choose(code);
    }, () => {
      $("loadError").hidden = false;
    });
    return;
  }
  $("loadError").hidden = true;
  setLanguage(code);
  remember("language", code);
  const search = new URLSearchParams(location.search);
  search.set("lng", code);
  attempt(() => history.replaceState(history.state, "", `?${search}${location.hash}`));
}

function wireLanguages() {
  const picker = $("language");
  const button = $("languageButton");
  button.addEventListener("click", () => setMenu($("languageList").hidden));
  $("languageList").addEventListener("click", (e) => {
    const option = e.target.closest("[data-language]");
    if (!option) return;
    choose(option.dataset.language);
    setMenu(false, button);
  });
  picker.addEventListener("keydown", (e) => {
    const list = options();
    const at = list.indexOf(document.activeElement);
    const open = !$("languageList").hidden;
    let to = null;
    if (e.key === "Escape" && open) {
      e.preventDefault();
      setMenu(false, button);
      return;
    }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      const current = list.findIndex((option) => option.getAttribute("aria-current") === "true");
      to = at < 0 ? current : (at + (e.key === "ArrowDown" ? 1 : -1) + list.length) % list.length;
    } else if (open && e.key === "Home") to = 0;
    else if (open && e.key === "End") to = list.length - 1;
    else return;
    e.preventDefault();
    if (!open) setMenu(true);
    list[to].focus();
  });
  picker.addEventListener("focusout", (e) => {
    if (e.relatedTarget && !picker.contains(e.relatedTarget)) setMenu(false);
  });
  document.addEventListener("pointerdown", (e) => {
    if (!picker.contains(e.target)) setMenu(false);
  });
}

function openReport(title, status) {
  $("reportTitle").textContent = title;
  $("reportStatus").textContent = status;
  $("reportList").replaceChildren();
  $("reportDownloads").replaceChildren();
  $("reportDownloads").hidden = true;
  if (!$("report").open) $("report").showModal();
}

function report(line) {
  const li = clone("reportTemplate");
  li.textContent = line;
  $("reportList").append(li);
}

async function runUpdate() {
  const tools = data.tools;
  openReport(tools.updateTitle, fill(tools.updateLoading, { source: data.source.name }));
  try {
    const { messages, fresh, files } = await fetchUpdate();
    messages.forEach(report);
    if (!fresh) {
      $("reportStatus").textContent = tools.updateBlocked;
      return;
    }
    if (!messages.length) report(tools.updateSame);
    $("reportStatus").textContent = fill(tools.updateReady, {
      civs: fresh.civs.length, items: Object.keys(fresh.availability).length, languages: Object.keys(fresh.languages).length,
    });
    $("reportDownloads").replaceChildren(...files.map(({ path, json }) => {
      const li = clone("downloadTemplate");
      const link = li.querySelector("a");
      link.href = URL.createObjectURL(new Blob([`${json}\n`], { type: "application/json" }));
      link.download = path.split("/").pop();
      link.textContent = fill(tools.download, { file: path });
      return li;
    }));
    $("reportDownloads").hidden = false;
  } catch (error) {
    $("reportStatus").textContent = fill(tools.updateFailed, { error: error.message });
  }
}

function start() {
  setIncluded(recall("include") === "true");
  showInclude();
  plant();
  buildLanguages();
  for (const node of document.querySelectorAll("[data-tool]")) node.textContent = data.tools[node.dataset.tool];
  wireTree();
  wireLanguages();
  wireOptions();
  const code = preferredLanguage();
  setLanguage(data.text[code] ? code : Object.keys(data.languages)[0]);
  $("top").hidden = false;
  $("content").hidden = false;
}

function showLoadError() {
  $("loadError").hidden = false;
}

load("data.json").then((raw) => {
  useData(raw);
  return params.has("test") || params.has("update") ? loadLanguages() : loadLanguage(preferredLanguage()).catch(() => null);
}).then(() => {
  start();
  if (params.has("update")) return runUpdate();
  return null;
}).catch((error) => {
  showLoadError();
  throw error;
});
</script>
</body>
