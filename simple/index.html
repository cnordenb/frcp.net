<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fresh Random Civ Picker (simple)</title>
</head>
<body>
<noscript>Fresh Random Civ Picker needs JavaScript.</noscript>
<script>
  // Loads the main page without images or sounds: image paths are blanked before the page
  // is written, and data-simple tells its script not to load any. simple.css, after the main
  // stylesheet, gives the page its simple layout.
  fetch("../index.html")
    .then((r) => {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    })
    .then((html) => {
      html = html
        .replace('<html lang="en">', '<html lang="en" data-simple>')
        .replace("<head>", '<head><base href="../">')
        .replace("<title>Fresh Random Civ Picker</title>", "<title>Fresh Random Civ Picker (simple)</title>")
        .replace('<link rel="stylesheet" href="style.css">', '<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="simple/simple.css">')
        .replace(/ src="images\//g, ' data-src="images/');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(() => {
      const p = document.createElement("p");
      p.textContent = "Fresh Random Civ Picker couldn't load. Check your connection, then reload the page.";
      document.body.append(p);
    });
</script>
</body>
</html>
